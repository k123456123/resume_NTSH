<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>寶可夢</title>

    <style>
        body {
            margin: 0;
            font-family: "Noto Sans TC", sans-serif;
            background: linear-gradient(135deg, #fff3e0, #ffffff);
        }

        header {
            background-color: #ef5350;
            color: white;
            text-align: center;
            padding: 40px 20px;
        }

        header h1 {
            margin: 0;
            font-size: 30px;
        }

        header p {
            margin-top: 10px;
            font-size: 16px;
        }

        .container {
            max-width: 900px;
            margin: 40px auto;
            padding: 20px;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 6px 15px rgba(0,0,0,0.08);
            text-align: center;
            margin-bottom: 20px;
        }

        .card h2 {
            color: #ef5350;
        }

        .card p {
            color: #555;
            line-height: 1.8;
        }

        .back {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 25px;
            background-color: #ef5350;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            transition: 0.3s;
        }

        .back:hover {
            background-color: #d32f2f;
        }

        footer {
            text-align: center;
            padding: 20px;
            color: #777;
            font-size: 14px;
        }
    </style>
</head>

<body>

<header>
    <h1>⚡ 寶可夢</h1>
    <p>探索寶可夢的世界</p>
</header>

<div class="container">

    <div class="card">
        <h2>🎮 關於寶可夢</h2>
        <p>
            寶可夢是一個源自日本的跨媒體作品系列，
            核心玩法圍繞著收集、養成、對戰與交換虛擬生物。
        </p>
    </div>

    <div class="card">
        <h2>🌟 寶可夢特色</h2>
        <p>
            玩家可以探索不同地區，捕捉各種寶可夢，
            並透過訓練提升寶可夢的能力，與其他訓練家進行對戰。
        </p>
    </div>

    <div class="card">
        <h2>🔍 我的學習紀錄</h2>
        <p>
            透過製作寶可夢相關網頁，我學習了 HTML、CSS
            以及網頁程式設計，也嘗試將 API 與網頁功能結合。
        </p>
    </div>

    <a class="back" href="/">🏠 回到首頁</a>

</div>

<footer>
    © 2026 黃科富 學習歷程檔案
</footer>

</body>
</html>
